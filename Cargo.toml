[workspace]
resolver = "2"
members = [
    "crates/sde-formats/motec",
    "crates/sde-formats/rbr",
    "crates/sde-formats/ibt",
    "crates/sde-formats/shtep",
    "crates/sde-formats/acr",
    "crates/sde-core",
    "crates/sde-setup",
    "crates/sde-cli",
    "crates/sde-app",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
# Desktop-app tuning. Thin LTO: most of fat LTO's size/perf win at a much lower
# compile-time cost — a reasonable default while the project is still iterating
# quickly. `panic = "unwind"` (the default) is kept deliberately: this tool parses
# untrusted/arbitrary telemetry log files, so panicking-but-recoverable behavior
# (e.g. catch_unwind around a parse) matters more here than shaving binary size
# via `panic = "abort"`.
lto = "thin"
codegen-units = 1
strip = true
