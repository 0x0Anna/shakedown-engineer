[package]
name = "sde-motec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Parser for MoTeC LD binary telemetry log files (part of the sde-formats workspace)"

[dependencies]
binrw = "0.15"
thiserror = "1"
roxmltree = "0.20"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
