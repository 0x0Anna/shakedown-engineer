[package]
name = "sde-ibt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Parser for iRacing .ibt binary telemetry log files (part of the sde-formats workspace)"

[dependencies]
binrw = "0.15"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
serde_json = "1"
