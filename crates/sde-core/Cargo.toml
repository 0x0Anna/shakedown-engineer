[package]
name = "sde-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Session/Channel/Lap data model built on top of sde-formats parsers (UI-free)"

[dependencies]
sde-motec = { path = "../sde-formats/motec" }
sde-ibt = { path = "../sde-formats/ibt" }
sde-shtep = { path = "../sde-formats/shtep" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
