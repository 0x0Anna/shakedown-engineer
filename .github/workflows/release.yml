name: Release

# Builds release binaries and attaches them to a GitHub Release whenever a version
# tag (e.g. v0.1.0) is pushed. Pre-1.0/early-stage project: no code signing or
# installers, just zipped/tarred binaries as release assets.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-x86_64
            app_bin: sde-app.exe
            cli_bin: dump_channels.exe
          - os: ubuntu-latest
            target_name: linux-x86_64
            app_bin: sde-app
            cli_bin: dump_channels
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps (Slint / rfd)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --workspace

      - name: Package binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "sde-${{ matrix.target_name }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/release/${{ matrix.app_bin }}" $staging/
          Copy-Item "target/release/${{ matrix.cli_bin }}" $staging/
          Copy-Item README.md $staging/
          Copy-Item LICENSE $staging/
          Compress-Archive -Path $staging/* -DestinationPath "$staging.zip"

      - name: Package binaries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          staging="sde-${{ matrix.target_name }}"
          mkdir "$staging"
          cp "target/release/${{ matrix.app_bin }}" "$staging/"
          cp "target/release/${{ matrix.cli_bin }}" "$staging/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sde-${{ matrix.target_name }}
          path: |
            sde-${{ matrix.target_name }}.zip
            sde-${{ matrix.target_name }}.tar.gz
          if-no-files-found: ignore

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
