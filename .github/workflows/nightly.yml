name: Nightly

# Scheduled build+test against both the pinned stable toolchain and Rust nightly,
# so upstream Rust/dependency regressions surface even without a push. Lightweight
# by design (no fmt/clippy gate) — failures are visible in the Actions tab, which is
# sufficient for a solo/small project (no external notifications wired up).

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {} # allow manual trigger from the Actions tab

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build+test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI deps (Slint / rfd)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - run: cargo build --workspace
      - run: cargo test --workspace
